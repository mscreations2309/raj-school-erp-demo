# Keep-alive: pings the Render demo every 14 min during 8 AM-10 PM IST (fits the 2,000 free Actions minutes of a private repo).
name: keep-alive
on:
  schedule:
    - cron: "*/14 2-16 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo
        run: curl -fsS --max-time 90 "${{ vars.DEMO_URL || 'https://raj-school-erp-demo.onrender.com' }}/api/health" || true
