# Keep-alive: pings the Render demo every 10 minutes, 24/7 (free for public repos). If the repo is made private, use "*/14 2-16 * * *" to stay within 2,000 free minutes.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo
        run: curl -fsS --max-time 90 "${{ vars.DEMO_URL || 'https://raj-school-erp-demo.onrender.com' }}/api/health" || true
