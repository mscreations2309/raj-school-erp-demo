# One-click free deployment on Render: web service (API + website + ERP) + free PostgreSQL
services:
  - type: web
    name: raj-school-erp-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      cd server && npm ci --include=dev && node scripts/use-postgres.js && npx prisma generate &&
      cd ../web && npm ci --include=dev && npm run build
    startCommand: cd server && node scripts/use-postgres.js && npx prisma db push --skip-generate --accept-data-loss && node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raj-school-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEFAULT_TENANT
        value: raj-english-school
      - key: DEMO_MODE
        value: "true"
      - key: SEED_MODE
        value: demo
      - key: FILE_STORAGE
        value: db
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: "*"
      - key: SUPER_ADMIN_EMAIL
        value: admin@rnygroups.com
      - key: SUPER_ADMIN_PASSWORD
        value: Admin@123

databases:
  - name: raj-school-db
    plan: free
    region: singapore
    databaseName: rajschool
    user: rajschool
